name: Publish CDN image

# Builds and pushes a separate nginx image that serves /gallery assets.
# Triggers only when relevant files change to avoid wasting CI minutes.

on:
  push:
    branches: [master]
    tags: ['cdn-v*.*.*']
    paths:
      - 'nginx/**'
      - 'public/gallery/**'
      - '.github/workflows/cdn.yml'
  workflow_dispatch:

concurrency:
  group: cdn-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Reuse repository owner; append "-cdn" so the package sits next to the
  # main one (e.g. ghcr.io/<owner>/<repo>-cdn).
  IMAGE_NAME: ${{ github.repository }}-cdn

jobs:
  build-and-push:
    name: Build and push CDN to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=match,pattern=cdn-v(\d+\.\d+\.\d+),group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Build context must be repo root so nginx/Dockerfile can `COPY public/gallery`.
          context: .
          file: ./nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
